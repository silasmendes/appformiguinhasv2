name: Validacao

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    name: Servidor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Validar servidor com dados temporarios
        run: python scripts/validate.py
